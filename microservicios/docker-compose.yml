version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: marketplace-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-}
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  ms-eureka:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: ms-eureka
    container_name: ms-eureka
    ports:
      - "8761:8761"
    environment:
      SERVER_PORT: 8761

  ms-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: ms-gateway
    container_name: ms-gateway
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      EUREKA_HOST: ms-eureka
      EUREKA_PORT: 8761
    depends_on:
      - ms-eureka

  ms-user:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: ms-user
    container_name: ms-user
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      DB_PASSWORD: ${DB_PASSWORD:-}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ms_user?createDatabaseIfNotExist=true
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://ms-eureka:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-esta_es_una_clave_secreta_muy_larga_y_segura_1234567890}
    depends_on:
      mysql:
        condition: service_healthy
      ms-eureka:
        condition: service_started

  ms-producto:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: ms-producto
    container_name: ms-producto
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      CATALOG_URL: http://ms-catalog:8085/api/v1/catalog
      INVENTORY_URL: http://ms-inventory:8084/api/v1/inventory
      SERVICES_CATALOG_URL: http://ms-catalog:8085/api/v1/catalog
      SERVICES_INVENTORY_URL: http://ms-inventory:8084/api/v1/inventory
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://ms-eureka:8761/eureka/
    depends_on:
      - ms-eureka
      - ms-catalog
      - ms-inventory

  ms-order:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: ms-order
    container_name: ms-order
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      DB_PASSWORD: ${DB_PASSWORD:-}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ms_order?createDatabaseIfNotExist=true
      CART_URL: http://ms-cart:8086/api/cart
      PAYMENT_URL: http://ms-payment:8088/api/pagos
      SERVICES_CART_URL: http://ms-cart:8086/api/cart
      SERVICES_PAYMENT_URL: http://ms-payment:8088/api/pagos
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://ms-eureka:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      ms-eureka:
        condition: service_started
      ms-cart:
        condition: service_started
      ms-payment:
        condition: service_started

  ms-inventory:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: ms-inventory
    container_name: ms-inventory
    ports:
      - "8084:8084"
    environment:
      SERVER_PORT: 8084
      DB_PASSWORD: ${DB_PASSWORD:-}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ms_inventory?createDatabaseIfNotExist=true
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://ms-eureka:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      ms-eureka:
        condition: service_started

  ms-catalog:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: ms-catalog
    container_name: ms-catalog
    ports:
      - "8085:8085"
    environment:
      SERVER_PORT: 8085
      DB_PASSWORD: ${DB_PASSWORD:-}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ms_catalog?createDatabaseIfNotExist=true
      INVENTORY_URL: http://ms-inventory:8084/api/v1/inventory
      SEARCH_URL: http://ms-search:8089/api/search
      SERVICES_INVENTORY_URL: http://ms-inventory:8084/api/v1/inventory
      SERVICES_SEARCH_URL: http://ms-search:8089/api/search
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://ms-eureka:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      ms-eureka:
        condition: service_started

  ms-cart:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: ms-cart
    container_name: ms-cart
    ports:
      - "8086:8086"
    environment:
      SERVER_PORT: 8086
      DB_PASSWORD: ${DB_PASSWORD:-}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ms_cart?createDatabaseIfNotExist=true
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://ms-eureka:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      ms-eureka:
        condition: service_started

  ms-payment:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: ms-payment
    container_name: ms-payment
    ports:
      - "8088:8088"
    environment:
      SERVER_PORT: 8088
      DB_PASSWORD: ${DB_PASSWORD:-}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ms_payment?createDatabaseIfNotExist=true
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://ms-eureka:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      ms-eureka:
        condition: service_started

  ms-search:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: ms-search
    container_name: ms-search
    ports:
      - "8089:8089"
    environment:
      SERVER_PORT: 8089
      DB_PASSWORD: ${DB_PASSWORD:-}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ms_search?createDatabaseIfNotExist=true
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://ms-eureka:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      ms-eureka:
        condition: service_started

  ms-notification:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: ms-notification
    container_name: ms-notification
    ports:
      - "8090:8090"
    environment:
      SERVER_PORT: 8090
      DB_PASSWORD: ${DB_PASSWORD:-}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ms_notification?createDatabaseIfNotExist=true
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://ms-eureka:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      ms-eureka:
        condition: service_started

volumes:
  mysql_data:
