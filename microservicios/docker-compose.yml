version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: marketplace-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-}
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  ms-eureka:
    build:
      context: ./ms-eureka
      dockerfile: Dockerfile
    container_name: ms-eureka
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8761

  ms-gateway:
    build:
      context: ./ms-gateway
      dockerfile: Dockerfile
    container_name: ms-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8080
      EUREKA_HOST: ms-eureka
      EUREKA_PORT: "8761"
    depends_on:
      - ms-eureka

  ms-user:
    build:
      context: ./ms-user
      dockerfile: Dockerfile
    container_name: ms-user
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8081
      EUREKA_HOST: ms-eureka
      EUREKA_PORT: "8761"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_NAME: ms_user
      DB_PASSWORD: ${DB_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-esta_es_una_clave_secreta_muy_larga_y_segura_1234567890}
    depends_on:
      mysql:
        condition: service_healthy
      ms-eureka:
        condition: service_started

  ms-producto:
    build:
      context: ./ms-producto
      dockerfile: Dockerfile
    container_name: ms-producto
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8082
      EUREKA_HOST: ms-eureka
      EUREKA_PORT: "8761"
      JWT_SECRET: ${JWT_SECRET:-esta_es_una_clave_secreta_muy_larga_y_segura_1234567890}
      SERVICES_CATALOG_URL: http://ms-catalog:8085/api/v1/catalog
      SERVICES_INVENTORY_URL: http://ms-inventory:8084/api/v1/inventory
    depends_on:
      - ms-eureka
      - ms-catalog
      - ms-inventory

  ms-order:
    build:
      context: ./ms-order
      dockerfile: Dockerfile
    container_name: ms-order
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8083
      EUREKA_HOST: ms-eureka
      EUREKA_PORT: "8761"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_NAME: ms_order
      DB_PASSWORD: ${DB_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-esta_es_una_clave_secreta_muy_larga_y_segura_1234567890}
      SERVICES_CART_URL: http://ms-cart:8086/api/cart
      SERVICES_PAYMENT_URL: http://ms-payment:8088/api/pagos
      SERVICES_INVENTORY_URL: http://ms-inventory:8084/api/v1/inventory
      SERVICES_CATALOG_URL: http://ms-catalog:8085/api/v1/catalog
      SERVICES_NOTIFICATION_URL: http://ms-notification:8090/api/notifications
    depends_on:
      mysql:
        condition: service_healthy
      ms-eureka:
        condition: service_started
      ms-cart:
        condition: service_started
      ms-payment:
        condition: service_started

  ms-inventory:
    build:
      context: ./ms-inventory
      dockerfile: Dockerfile
    container_name: ms-inventory
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8084
      EUREKA_HOST: ms-eureka
      EUREKA_PORT: "8761"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_NAME: ms_inventory
      DB_PASSWORD: ${DB_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-esta_es_una_clave_secreta_muy_larga_y_segura_1234567890}
    depends_on:
      mysql:
        condition: service_healthy
      ms-eureka:
        condition: service_started

  ms-catalog:
    build:
      context: ./ms-catalog
      dockerfile: Dockerfile
    container_name: ms-catalog
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8085
      EUREKA_HOST: ms-eureka
      EUREKA_PORT: "8761"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_NAME: ms_catalog
      DB_PASSWORD: ${DB_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-esta_es_una_clave_secreta_muy_larga_y_segura_1234567890}
      SERVICES_INVENTORY_URL: http://ms-inventory:8084/api/v1/inventory
      SERVICES_SEARCH_URL: http://ms-search:8089/api/search
    depends_on:
      mysql:
        condition: service_healthy
      ms-eureka:
        condition: service_started

  ms-cart:
    build:
      context: ./ms-cart
      dockerfile: Dockerfile
    container_name: ms-cart
    ports:
      - "8086:8086"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8086
      EUREKA_HOST: ms-eureka
      EUREKA_PORT: "8761"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_NAME: ms_cart
      DB_PASSWORD: ${DB_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-esta_es_una_clave_secreta_muy_larga_y_segura_1234567890}
    depends_on:
      mysql:
        condition: service_healthy
      ms-eureka:
        condition: service_started

  ms-auth:
    build:
      context: ./ms-auth
      dockerfile: Dockerfile
    container_name: ms-auth
    ports:
      - "8087:8087"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8087
      EUREKA_HOST: ms-eureka
      EUREKA_PORT: "8761"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_NAME: ms_auth
      DB_PASSWORD: ${DB_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-esta_es_una_clave_secreta_muy_larga_y_segura_1234567890}
    depends_on:
      mysql:
        condition: service_healthy
      ms-eureka:
        condition: service_started

  ms-payment:
    build:
      context: ./ms-payment
      dockerfile: Dockerfile
    container_name: ms-payment
    ports:
      - "8088:8088"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8088
      EUREKA_HOST: ms-eureka
      EUREKA_PORT: "8761"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_NAME: ms_payment
      DB_PASSWORD: ${DB_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-esta_es_una_clave_secreta_muy_larga_y_segura_1234567890}
    depends_on:
      mysql:
        condition: service_healthy
      ms-eureka:
        condition: service_started

  ms-search:
    build:
      context: ./ms-search
      dockerfile: Dockerfile
    container_name: ms-search
    ports:
      - "8089:8089"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8089
      EUREKA_HOST: ms-eureka
      EUREKA_PORT: "8761"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_NAME: ms_search
      DB_PASSWORD: ${DB_PASSWORD:-}
    depends_on:
      mysql:
        condition: service_healthy
      ms-eureka:
        condition: service_started

  ms-notification:
    build:
      context: ./ms-notification
      dockerfile: Dockerfile
    container_name: ms-notification
    ports:
      - "8090:8090"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8090
      EUREKA_HOST: ms-eureka
      EUREKA_PORT: "8761"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_NAME: ms_notification
      DB_PASSWORD: ${DB_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-esta_es_una_clave_secreta_muy_larga_y_segura_1234567890}
    depends_on:
      mysql:
        condition: service_healthy
      ms-eureka:
        condition: service_started

volumes:
  mysql_data:
