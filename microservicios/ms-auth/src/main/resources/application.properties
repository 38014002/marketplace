# ==========================================
# Configuración del Microservicio
# ==========================================
spring.application.name=ms-auth
server.port=8087

# ==========================================
# Base de Datos (MySQL)
# ==========================================
# Se crea la base de datos ms_auth si no existe
spring.datasource.url=jdbc:mysql://localhost:3306/ms_auth?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=purogol2026
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Hibernate crea la tabla inicialmente para no dar error de validación
spring.jpa.hibernate.ddl-auto=update

# Flyway se sincroniza con lo que Hibernate cree
spring.flyway.baseline-on-migrate=true
spring.flyway.enabled=true


spring.flyway.locations=classpath:db/migration

# ==========================================
# Seguridad JWT
# ==========================================
# ¡IMPORTANTE! Debe ser la misma clave que en ms-user (puerto 8080)
jwt.secret=esta_es_una_clave_secreta_muy_larga_y_segura_1234567890

# ==========================================
# Configuración de Logs (Formato JSON)
# ==========================================
logging.level.root=INFO
# Ver detalles de tu código
logging.level.com.marketplace.ms_auth=DEBUG
# Ver qué está pasando con WebClient (la llamada al 8080)
logging.level.org.springframework.web.reactive.function.client.WebClient=DEBUG
# Ver las consultas SQL
logging.level.org.hibernate.SQL=DEBUG