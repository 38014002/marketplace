spring.application.name=ms-cart
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=${SERVER_PORT:8086}

# Eureka
eureka.client.service-url.defaultZone=http://${EUREKA_HOST:ms-eureka}:${EUREKA_PORT:8761}/eureka/

# Base de datos
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql-cart}:${DB_PORT:3306}/${DB_NAME:ms_cart}?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=none

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JSON
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT
jwt.secret=${JWT_SECRET:esta_es_una_clave_secreta_muy_larga_y_segura_1234567890}

# URLs de otros microservicios
services.product.url=http://ms-producto:8082/api/productos
services.user.url=http://ms-user:8081/api/usuarios
