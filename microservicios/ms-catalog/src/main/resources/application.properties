# 1. Configuración del Servidor
spring.application.name=ms-catalog
server.port=${SERVER_PORT:8085}

eureka.instance.prefer-ip-address=true
eureka.client.service-url.defaultZone=http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/

# 2. Configuración de la Base de Datos
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ms_catalog}?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:purogol2026}

# 3. Configuración de JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Cambiado a 'none' como lo tenías originalmente para que respete tus migraciones de Flyway
spring.jpa.hibernate.ddl-auto=none

# 4. Configuración de Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# 5. Formato de JSON
spring.jackson.serialization.write-dates-as-timestamps=false

# 6. Logging
logging.file.name=logs/ms-catalog.log
logging.level.root=INFO
logging.level.com.marketplace=DEBUG
logging.level.org.springframework.security=DEBUG

# 7. SEGURIDAD JWT
jwt.secret=${JWT_SECRET:esta_es_una_clave_secreta_muy_larga_y_segura_1234567890}