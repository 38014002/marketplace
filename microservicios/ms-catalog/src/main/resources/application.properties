# 1. Configuración del Servidor
server.port=8082
spring.application.name=ms-catalog
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# 2. Configuración de la Base de Datos (ms_catalog)
spring.datasource.url=jdbc:mysql://localhost:3306/ms_catalog?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=purogol2026

# 3. Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# 4. Configuración de Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# 5. CONFIGURACIÓN DE LOGS (Lo que necesitabas)
# Esto crea la carpeta /logs y el archivo dentro de la raíz del proyecto
logging.file.name=logs/ms-catalog.log
# Define qué tanto detalle quieres guardar en el archivo
logging.level.root=INFO
logging.level.com.marketplace=DEBUG
logging.level.org.springframework.security=DEBUG
# Formato de la fecha en los logs
spring.jackson.serialization.write-dates-as-timestamps=false

# 6. Seguridad JWT (Asegúrate de que sea la misma clave que ms-user)
jwt.secret=esta_es_una_clave_secreta_muy_larga_y_segura_1234567890