server.port=8080
spring.application.name=ms-gateway

# Conexión con tu servidor Eureka Server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# ==========================================
# CONFIGURACIÓN DE ENRUTAMIENTO (GATEWAY)
# ==========================================

# 1. Ruta para ms-user
spring.cloud.gateway.routes[0].id=ms-user
spring.cloud.gateway.routes[0].uri=lb://ms-user
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/usuarios/**

# 2. Ruta para ms-producto
spring.cloud.gateway.routes[1].id=ms-producto
spring.cloud.gateway.routes[1].uri=lb://ms-producto
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/productos/**

# 3. Ruta para ms-order
spring.cloud.gateway.routes[2].id=ms-order
spring.cloud.gateway.routes[2].uri=lb://ms-order
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/orders/**

# 4. Ruta para ms-payment
spring.cloud.gateway.routes[3].id=ms-payment
spring.cloud.gateway.routes[3].uri=lb://ms-payment
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/pagos/**

# 5. Ruta para ms-notification
spring.cloud.gateway.routes[4].id=ms-notification
spring.cloud.gateway.routes[4].uri=lb://ms-notification
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/notifications/**

# 6. Ruta para ms-search
spring.cloud.gateway.routes[5].id=ms-search
spring.cloud.gateway.routes[5].uri=lb://ms-search
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/search/**

# 7. Ruta para ms-cart
spring.cloud.gateway.routes[5].id=ms-cart
spring.cloud.gateway.routes[5].uri=lb://ms-cart
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/cart/**

# 8. Ruta para ms-catalog
spring.cloud.gateway.routes[5].id=ms-catalog
spring.cloud.gateway.routes[5].uri=lb://ms-catalog
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/catalog/**

# 9. Ruta para ms-auth
spring.cloud.gateway.routes[5].id=ms-auth
spring.cloud.gateway.routes[5].uri=lb://ms-auth
spring.cloud.gateway.routes[5].predicates[0]=Path=/auth/**

# 10. Ruta para ms-cart
spring.cloud.gateway.routes[5].id=ms-inventory
spring.cloud.gateway.routes[5].uri=lb://ms-inventory
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/inventory/**
