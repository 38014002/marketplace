spring:
  application:
    name: ms-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  cloud:
    gateway:
      routes:
        - id: ms-user
          uri: lb://ms-user
          predicates:
            - Path=/api/usuarios/**

        - id: ms-producto
          uri: lb://ms-producto
          predicates:
            - Path=/api/productos/**

        - id: ms-order
          uri: lb://ms-order
          predicates:
            - Path=/api/orders/**

        - id: ms-payment
          uri: lb://ms-payment
          predicates:
            - Path=/api/payments/**
          filters:
            - RewritePath=/api/payments/(?<segment>.*), /api/pagos/${segment}

        - id: ms-notification
          uri: lb://ms-notification
          predicates:
            - Path=/api/notifications/**

        - id: ms-search
          uri: lb://ms-search
          predicates:
            - Path=/api/search/**

        - id: ms-cart
          uri: lb://ms-cart
          predicates:
            - Path=/api/cart/**

        - id: ms-catalog
          uri: lb://ms-catalog
          predicates:
            - Path=/api/catalog/**
          filters:
            - RewritePath=/api/catalog/(?<segment>.*), /api/v1/catalog/${segment}

        - id: ms-auth
          uri: lb://ms-auth
          predicates:
            - Path=/auth/**

        - id: ms-inventory
          uri: lb://ms-inventory
          predicates:
            - Path=/api/inventory/**
          filters:
            - RewritePath=/api/inventory/(?<segment>.*), /api/v1/inventory/${segment}

server:
  port: ${SERVER_PORT:8080}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/
