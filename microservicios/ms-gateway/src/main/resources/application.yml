spring:
  application:
    name: ms-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  cloud:
    gateway:
      routes:
        - id: ms-user
          uri: lb://MS-USER
          predicates:
            - Path=/api/usuarios/**

        - id: ms-producto
          uri: lb://MS-PRODUCTO
          predicates:
            - Path=/api/productos/**

        - id: ms-order
          uri: lb://MS-ORDER
          predicates:
            - Path=/api/orders/**

        - id: ms-payment
          uri: lb://MS-PAYMENT
          predicates:
            - Path=/api/pagos/**

        - id: ms-notification
          uri: lb://MS-NOTIFICATION
          predicates:
            - Path=/api/notifications/**

        - id: ms-search
          uri: lb://MS-SEARCH
          predicates:
            - Path=/api/search/**

        - id: ms-cart
          uri: lb://MS-CART
          predicates:
            - Path=/api/cart/**

        - id: ms-catalog
          uri: lb://MS-CATALOG
          predicates:
            - Path=/api/v1/catalog/**

        - id: ms-auth
          uri: lb://MS-AUTH
          predicates:
            - Path=/auth/**

        - id: ms-inventory
          uri: lb://MS-INVENTORY
          predicates:
            - Path=/api/v1/inventory/**

server:
  port: ${SERVER_PORT:8080}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/
