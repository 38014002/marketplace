# 1. Configuración del Servidor
server.port=8084
spring.application.name=ms-inventory

# 2. Configuración de la Base de Datos
spring.datasource.url=jdbc:mysql://localhost:3306/ms_inventory?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=purogol2026

# 3. Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# 4. Configuración de Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# 5. Formato de JSON
spring.jackson.serialization.write-dates-as-timestamps=false

# 6. Logging
logging.level.org.springframework.security=DEBUG

# 7. SEGURIDAD JWT
# IMPORTANTE: Esta clave debe ser idéntica a la del ms-user y ms-catalog
jwt.secret=esta_es_una_clave_secreta_muy_larga_y_segura_1234567890

