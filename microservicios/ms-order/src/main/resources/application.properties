# 1. Servidor
server.port=8083
spring.application.name=ms-order
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# 2. Base de Datos
spring.datasource.url=jdbc:mysql://localhost:3306/ms_order?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}

# 3. Hibernate y Flyway
# IMPORTANTE: Cambiamos 'update' a 'none' para que Flyway sea el que mande
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Habilitar Flyway correctamente
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
# Esto asegura que busque los scripts en la carpeta que creamos
spring.flyway.locations=classpath:db/migration

# 4. Logs (Nivel de detalle)
logging.level.root=INFO
logging.level.com.marketplace.ms_order=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# 5. Seguridad JWT (Sincronizada con el ecosistema)
jwt.secret=esta_es_una_clave_secreta_muy_larga_y_segura_1234567890

