spring.application.name=ms-order
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=${SERVER_PORT:8083}

eureka.client.service-url.defaultZone=http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ms_order}?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

services.cart.url=${SERVICES_CART_URL:http://localhost:8086/api/cart}
services.payment.url=${SERVICES_PAYMENT_URL:http://localhost:8088/api/pagos}
services.inventory.url=${SERVICES_INVENTORY_URL:http://localhost:8084/api/v1/inventory}
services.catalog.url=${SERVICES_CATALOG_URL:http://localhost:8085/api/v1/catalog}
services.notification.url=${SERVICES_NOTIFICATION_URL:http://localhost:8090/api/notifications}

jwt.secret=${JWT_SECRET:esta_es_una_clave_secreta_muy_larga_y_segura_1234567890}
