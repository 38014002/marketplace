spring.application.name=ms-producto
server.port=8082
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Conexión a DB
spring.datasource.url=jdbc:mysql://localhost:3306/ms_product?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=purogol2026

# JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Cambiamos validate por none para que Flyway mande sin conflictos
spring.jpa.hibernate.ddl-auto=none

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Esto ayuda si Flyway se queda trabado por errores previos
spring.flyway.baseline-on-migrate=true

