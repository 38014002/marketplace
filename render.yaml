# Blueprint Render — Marketplace Microservicios
# https://render.com/docs/blueprint-spec
#
# Requisitos previos:
# 1. MySQL externo (Railway, Aiven, PlanetScale, etc.)
# 2. Configurar DB_HOST y DB_PASSWORD en el grupo marketplace-shared
# 3. Conectar repo GitHub → New Blueprint → seleccionar render.yaml
#
# URL pública: https://marketplace-gateway.onrender.com (tras el deploy)

envVarGroups:
  - name: marketplace-shared
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        generateValue: true
      - key: DB_USER
        value: root
      - key: DB_PORT
        value: "3306"
      - key: DB_HOST
        sync: false
      - key: DB_PASSWORD
        sync: false

services:
  # --- Infraestructura ---
  - type: pserv
    name: marketplace-eureka
    runtime: docker
    region: oregon
    plan: starter
    dockerfilePath: ./microservicios/ms-eureka/Dockerfile
    dockerContext: ./microservicios/ms-eureka
    envVars:
      - fromGroup: marketplace-shared
      - key: SERVER_PORT
        value: 8761

  # --- API Gateway (único servicio público) ---
  - type: web
    name: marketplace-gateway
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./microservicios/ms-gateway/Dockerfile
    dockerContext: ./microservicios/ms-gateway
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: marketplace-shared
      - key: SERVER_PORT
        value: 8080
      - key: EUREKA_HOST
        fromService:
          type: pserv
          name: marketplace-eureka
          property: host
      - key: EUREKA_PORT
        fromService:
          type: pserv
          name: marketplace-eureka
          property: port

  # --- Microservicios de negocio (red privada Render) ---
  - type: pserv
    name: marketplace-ms-user
    runtime: docker
    region: oregon
    plan: starter
    dockerfilePath: ./microservicios/ms-user/Dockerfile
    dockerContext: ./microservicios/ms-user
    envVars:
      - fromGroup: marketplace-shared
      - key: SERVER_PORT
        value: 8081
      - key: DB_NAME
        value: ms_user
      - key: EUREKA_HOST
